<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">

    <link rel="manifest" href="favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clash-Wiki : vidéo tutoriel officiel de Clash Royale pour comprendre les bases du gameplay.">
    <title>Gameplay</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

<header class="titre">
    Clash-Wiki
    <div class="menu">
        <a href="menu.html">
            <span class="barre"></span>
            <span class="barre"></span>
            <span class="barre"></span>
        </a>
    </div>
</header>

<h1>Gameplay</h1>

<p>Voici une vidéo du tutoriel de Clash Royale.
    <a href="index.html">(voir page accueil)</a> pour plus de précision.</p>

<!-- CORRECTION : class="video" retiré de l'iframe, ajout de width/height 100% -->
<div class="video">
    <iframe style="width:100%; height:100%;"
            src="https://www.youtube.com/embed/zqviv3l0Rug?autoplay=1&mute=1&controls=1&rel=0"
            title="Tutoriel Clash Royale"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
    </iframe>
</div>

<footer>
    &copy;Valentin Allimann 2026
    <p class="footer-text">Vous pouvez retrouver les comptes officiels de Clash Royale sur les différentes plateformes ci-dessous.</p>
    <div class="footer-logos">
        <a href="https://www.youtube.com/@ClashRoyale" target="_blank">
            <img src="./img/logo-YouTube.png" alt="logo YouTube">
        </a>
        <a href="https://x.com/ClashRoyale" target="_blank">
            <img src="./img/logo-X.avif" alt="logo X">
        </a>
        <a href="https://www.tiktok.com/@clashroyale" target="_blank">
            <img src="./img/logo-TikTok.avif" alt="logo TikTok">
        </a>
    </div>
</footer>
<script>
    let lastScroll = 0;
    const header = document.querySelector('header');

    window.addEventListener('scroll', () => {
        const current = window.scrollY;
        if (current > lastScroll && current > 80) {
            header.style.transform = 'translateY(-100%)';
        } else {
            header.style.transform = 'translateY(0)';
        }
        lastScroll = current;
    });
</script>
</body>
</html>
